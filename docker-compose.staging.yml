# ─────────────────────────────────────────────────────────────────────────────
# ResortPro — Staging (Local Server / Portainer)
#
# এই file টি dev branch push হলে GitHub Actions দিয়ে Portainer-এ deploy হবে।
# Infrastructure (postgres, redis) backend stack থেকে আলাদা network দিয়ে connect।
# ─────────────────────────────────────────────────────────────────────────────

name: resortpro-staging

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resortpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resortpro_staging}
      POSTGRES_DB: ${POSTGRES_DB:-resortpro_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-resortpro}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API (Fastify) ────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - '4001:4000'
    environment: &api-env-staging
      # Pinned rather than left to derive from cwd, so the path the app writes to
      # and the path the volume is mounted at cannot drift apart.
      STORAGE_LOCAL_DIR: /app/uploads
      NODE_ENV: staging
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-resortpro}:${POSTGRES_PASSWORD:-resortpro_staging}@postgres:5432/${POSTGRES_DB:-resortpro_staging}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${WEB_URL:-https://resortpro.webcoronet.com}
      APP_DOMAIN: ${APP_DOMAIN:-resortpro.webcoronet.com}
      APP_IP: ${APP_IP:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-asadsnapper@gmail.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://resortpro.webcoronet.com}
      # Staging's demo tenant is disposable, so it is rebuilt on every start and
      # nightly (jobs/refresh-demo.ts) to stop its dates going stale. Never set
      # this on production — a refresh deletes the demo tenant first.
      SEED_DEMO_REFRESH: ${SEED_DEMO_REFRESH:-}
    # Guest ID/passport scans, room and website images are written here by the
    # local storage driver. Without this volume the container filesystem — and
    # every uploaded document with it — is discarded on redeploy.
    volumes:
      - uploads_staging_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5



  # ── Database backup ──────────────────────────────────────────────────────────
  # A daily pg_dump, verified with `pg_restore --list` before it is kept. Uses
  # the postgres image purely for its client tools, so nothing has to be
  # installed on the host and this works the same under Portainer and Coolify.
  #
  # Scope, stated plainly: this protects against the failures that actually
  # happen — a bad migration, a mistaken delete, operator error. It does NOT
  # protect against losing the host, because the dumps sit on the same machine.
  # Copying backups_staging_data off-box is the remaining step, and it is a
  # deliberate follow-up rather than something quietly assumed to be done.
  backup:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:dev
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-resortpro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-resortpro}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups_staging_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # One run at start (so a fresh deploy has a backup immediately rather than
    # 24 hours later), then once a day.
    entrypoint: ['sh', '-c', 'while true; do sh /app/scripts/backup-db.sh || echo "[backup] run failed"; sleep 86400; done']

  # ── Background worker (cron jobs) ────────────────────────────────────────────
  # worker.ts is the only process that schedules pre-arrival reminders, iCal
  # sync, daily reports, automation sequences, trial emails and expiry of
  # abandoned public booking holds. Without this service none of them run —
  # they fail silently, which is why it went unnoticed.
  #
  # Same image as the api, different command: the api's CMD also runs
  # `prisma migrate deploy` and the seeds, and two containers doing that at
  # once would race. This waits for the api to be healthy, by which time
  # migrations have already been applied.
  #
  # Exactly one replica. These are cron schedules, not queue consumers — a
  # second instance would send every reminder twice.
  worker:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:dev
    pull_policy: always
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env-staging
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1

  # ── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/asadsnapper-beep/resort-pro-web:dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: ${API_URL:-https://resortpro-api.webcoronet.com}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_staging_data:
  backups_staging_data:
  uploads_staging_data:
  redis_staging_data:
