# ─────────────────────────────────────────────────────────────────────────────
# ResortPro — Coolify deployment (pre-built images from GHCR)
#
# Images are built by GitHub Actions (.github/workflows/docker-build.yml)
# and pushed to ghcr.io/asadsnapper-beep/resort-pro-api:latest
#                   ghcr.io/asadsnapper-beep/resort-pro-web:latest
#
# Coolify setup:
#   1. New Resource → Docker Compose → this file
#   2. Set environment variables (see .env.example)
#   3. Domains: api → api.resortpro.site, web → app.resortpro.site
# ─────────────────────────────────────────────────────────────────────────────

name: resortpro

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resortpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-resortpro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-resortpro}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - coolify
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:latest
    pull_policy: always
    restart: unless-stopped
    environment: &api-env-coolify
      # Pinned rather than left to derive from cwd, so the path the app writes to
      # and the path the volume is mounted at cannot drift apart.
      STORAGE_LOCAL_DIR: /app/uploads
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-resortpro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resortpro}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${WEB_URL}
      APP_DOMAIN: ${APP_DOMAIN}
      APP_IP: ${APP_IP:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_FREE: ${STRIPE_PRICE_FREE:-}
      STRIPE_PRICE_FREE_ANNUAL: ${STRIPE_PRICE_FREE_ANNUAL:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_STARTER_ANNUAL: ${STRIPE_PRICE_STARTER_ANNUAL:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      STRIPE_PRICE_ENTERPRISE_ANNUAL: ${STRIPE_PRICE_ENTERPRISE_ANNUAL:-}
      BKASH_PRICE_FREE: ${BKASH_PRICE_FREE:-}
      BKASH_PRICE_FREE_ANNUAL: ${BKASH_PRICE_FREE_ANNUAL:-}
      LAUNCH_PROMOTION_ENABLED: ${LAUNCH_PROMOTION_ENABLED:-false}
      LAUNCH_PROMOTION_START_AT: ${LAUNCH_PROMOTION_START_AT:-}
      LAUNCH_PROMOTION_END_AT: ${LAUNCH_PROMOTION_END_AT:-}
      NEXT_PUBLIC_APP_URL: ${WEB_URL}
    networks:
      - coolify
    # Guest ID/passport scans, room and website images are written here by the
    # local storage driver. Without this volume the container filesystem — and
    # every uploaded document with it — is discarded on redeploy.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5


  # ── Database backup ──────────────────────────────────────────────────────────
  # A daily pg_dump, verified with `pg_restore --list` before it is kept. Uses
  # the postgres image purely for its client tools, so nothing has to be
  # installed on the host and this works the same under Portainer and Coolify.
  #
  # Scope, stated plainly: this protects against the failures that actually
  # happen — a bad migration, a mistaken delete, operator error. It does NOT
  # protect against losing the host, because the dumps sit on the same machine.
  # Copying backups_data off-box is the remaining step, and it is a
  # deliberate follow-up rather than something quietly assumed to be done.
  backup:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-resortpro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-resortpro}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # One run at start (so a fresh deploy has a backup immediately rather than
    # 24 hours later), then once a day.
    entrypoint: ['sh', '-c', 'while true; do sh /app/scripts/backup-db.sh || echo "[backup] run failed"; sleep 86400; done']

  # ── Background worker (cron jobs) ────────────────────────────────────────────
  # worker.ts is the only process that schedules pre-arrival reminders, iCal
  # sync, daily reports, automation sequences, trial emails and expiry of
  # abandoned public booking holds. Without this service none of them run —
  # they fail silently, which is why it went unnoticed.
  #
  # Same image as the api, different command: the api's CMD also runs
  # `prisma migrate deploy` and the seeds, and two containers doing that at
  # once would race. This waits for the api to be healthy, by which time
  # migrations have already been applied.
  #
  # Exactly one replica. These are cron schedules, not queue consumers — a
  # second instance would send every reminder twice.
  worker:
    image: ghcr.io/asadsnapper-beep/resort-pro-api:latest
    pull_policy: always
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env-coolify
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1

  web:
    image: ghcr.io/asadsnapper-beep/resort-pro-web:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CLARITY_ID: ${CLARITY_ID:-}
    networks:
      - coolify
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  backups_data:
  uploads_data:
  redis_data:

networks:
  coolify:
    external: true
