name: Deploy to Staging (Portainer)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─── Step 1: Build & push Docker images (dev tag) ─────────────────────────
  build:
    name: Build & Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/resort-pro-api:dev
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build and push Web image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/resort-pro-web:dev
          build-args: |
            NEXT_PUBLIC_API_URL=https://resortpro-api.webcoronet.com
          cache-from: type=gha,scope=web-dev
          cache-to: type=gha,mode=max,scope=web-dev

  # ─── Step 2: Deploy to Portainer ──────────────────────────────────────────
  deploy:
    name: Deploy to Portainer (Staging)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://resortpro.webcoronet.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Portainer stack ID
        id: stack
        run: |
          STACK_ID=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/stacks" \
            | jq -r '.[] | select(.Name=="resortpro-staging") | .Id')
          echo "id=$STACK_ID" >> $GITHUB_OUTPUT
          echo "Stack ID: $STACK_ID"

      - name: Create stack if not exists
        if: steps.stack.outputs.id == ''
        run: |
          # Get endpoint ID (local environment)
          ENDPOINT_ID=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/endpoints" \
            | jq -r '.[0].Id')

          echo "Endpoint ID: $ENDPOINT_ID"

          # Create new stack from compose file
          COMPOSE_CONTENT=$(cat docker-compose.staging.yml)

          curl -s -X POST \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://docker.webcoronet.com/api/stacks/create/standalone/string?endpointId=${ENDPOINT_ID}" \
            -d "{
              \"name\": \"resortpro-staging\",
              \"stackFileContent\": $(echo "$COMPOSE_CONTENT" | jq -Rs .),
              \"env\": []
            }"

      - name: Update existing stack
        if: steps.stack.outputs.id != ''
        run: |
          STACK_ID=${{ steps.stack.outputs.id }}
          COMPOSE_CONTENT=$(cat docker-compose.staging.yml)

          # Get endpoint ID
          ENDPOINT_ID=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/stacks/${STACK_ID}" \
            | jq -r '.EndpointId')

          curl -s -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://docker.webcoronet.com/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            -d "{
              \"stackFileContent\": $(echo "$COMPOSE_CONTENT" | jq -Rs .),
              \"pullImage\": true,
              \"prune\": false,
              \"env\": []
            }"

      - name: Summary
        run: |
          echo "✅ Staging deployed!"
          echo "🌐 Web:  https://resortpro.webcoronet.com"
          echo "🔌 API:  https://resortpro-api.webcoronet.com"
          echo "📦 Commit: ${{ github.sha }}"
