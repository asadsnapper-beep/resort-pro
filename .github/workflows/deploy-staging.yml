name: Deploy to Staging (Portainer)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─── Step 1: Build & push Docker images (dev tag) ─────────────────────────
  build:
    name: Build & Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both tags point at the exact same image. `:dev` stays as the
      # human-friendly floating tag (for manual `docker pull`); `:dev-<sha>`
      # is what the deploy step actually asks Portainer to run — see the
      # note in the deploy job for why the floating tag alone isn't enough.
      - name: Build and push API image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:dev
            ghcr.io/${{ env.OWNER }}/resort-pro-api:dev-${{ github.sha }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build and push Web image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:dev
            ghcr.io/${{ env.OWNER }}/resort-pro-web:dev-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://resortpro-api.webcoronet.com
          cache-from: type=gha,scope=web-dev
          cache-to: type=gha,mode=max,scope=web-dev

  # ─── Step 2: Deploy to Portainer ──────────────────────────────────────────
  deploy:
    name: Deploy to Portainer (Staging)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://resortpro.webcoronet.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Portainer stack ID
        id: stack
        run: |
          STACK_ID=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/stacks" \
            | jq -r '.[] | select(.Name=="resortpro-staging") | .Id')
          echo "id=$STACK_ID" >> $GITHUB_OUTPUT
          echo "Stack ID: $STACK_ID"

      # Root cause (confirmed live, 2026-07-27 — see plan/theme-studio-and-design-service.md
      # sibling investigation notes): Portainer decides whether to recreate a
      # container by diffing the compose file's TEXT, not the resolved image
      # digest. `pull_policy: always` does make it pull a fresh `:dev` image
      # into the local cache, but since the tag string never changes,
      # Portainer sees no config diff and never swaps the running container
      # onto it — the API/web containers can silently run an arbitrarily old
      # image while every deploy still reports success. Known upstream bug:
      # https://github.com/portainer/portainer/issues/13173
      #
      # Fix: stamp a real, unique tag (the commit SHA) into the compose text
      # sent to Portainer on every deploy, so the config genuinely differs
      # every time and a recreate is forced. docker-compose.staging.yml in
      # the repo keeps the floating `:dev` tag for humans; only the copy we
      # hand to Portainer gets rewritten.
      - name: Stamp images with this commit's SHA tag
        run: |
          sed \
            -e "s#resort-pro-api:dev#resort-pro-api:dev-${GITHUB_SHA}#" \
            -e "s#resort-pro-web:dev#resort-pro-web:dev-${GITHUB_SHA}#" \
            docker-compose.staging.yml > /tmp/docker-compose.staging.deploy.yml

      - name: Create stack if not exists
        if: steps.stack.outputs.id == ''
        run: |
          # Get endpoint ID (local environment)
          ENDPOINT_ID=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/endpoints" \
            | jq -r '.[0].Id')

          echo "Endpoint ID: $ENDPOINT_ID"

          # Create new stack from compose file
          COMPOSE_CONTENT=$(cat /tmp/docker-compose.staging.deploy.yml)

          HTTP_STATUS=$(curl -s -o /tmp/portainer-create.txt -w "%{http_code}" -X POST \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://docker.webcoronet.com/api/stacks/create/standalone/string?endpointId=${ENDPOINT_ID}" \
            -d "{
              \"name\": \"resortpro-staging\",
              \"stackFileContent\": $(echo "$COMPOSE_CONTENT" | jq -Rs .),
              \"env\": []
            }")

          cat /tmp/portainer-create.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Portainer stack creation failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Update existing stack
        if: steps.stack.outputs.id != ''
        run: |
          STACK_ID=${{ steps.stack.outputs.id }}
          COMPOSE_CONTENT=$(cat /tmp/docker-compose.staging.deploy.yml)

          # Read the stack once: the endpoint id and the environment come from
          # the same response.
          STACK_JSON=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/stacks/${STACK_ID}")

          ENDPOINT_ID=$(echo "$STACK_JSON" | jq -r '.EndpointId')

          # Carry the existing environment forward. This PUT used to send
          # `"env": []`, which is not "leave it alone" — it is "delete
          # everything". Any variable set through Portainer's stack UI survived
          # exactly until the next push, then vanished with nothing to point at.
          EXISTING_ENV=$(echo "$STACK_JSON" | jq -c '.Env // []')
          echo "Preserving $(echo "$EXISTING_ENV" | jq 'length') stack environment variable(s)"

          # This used to be a bare `curl -s` whose response was thrown away, so
          # any Portainer error — most often a name conflict with a container
          # someone once created by hand outside compose — left the step
          # exiting 0 and the whole workflow green while nothing was deployed.
          # Staging then served an arbitrarily old image with every run
          # reporting success. Production already checks its status; this is
          # the same treatment.
          HTTP_STATUS=$(curl -s -o /tmp/portainer-resp.txt -w "%{http_code}" -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://docker.webcoronet.com/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            -d "{
              \"stackFileContent\": $(echo "$COMPOSE_CONTENT" | jq -Rs .),
              \"pullImage\": true,
              \"prune\": false,
              \"env\": ${EXISTING_ENV}
            }")

          cat /tmp/portainer-resp.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Portainer stack update failed with HTTP $HTTP_STATUS — staging is still running the previous image."
            exit 1
          fi

      # A 2xx means Portainer accepted the request, not that it kept it. Read
      # the stack back and confirm this commit's SHA is really in the stored
      # compose — the difference between "deployed" and "reported deployed".
      - name: Verify Portainer stored this commit
        run: |
          STORED=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "https://docker.webcoronet.com/api/stacks/${{ steps.stack.outputs.id }}/file" \
            | jq -r '.StackFileContent // ""')

          if echo "$STORED" | grep -q "resort-pro-api:dev-${GITHUB_SHA}"; then
            echo "Portainer stack pins dev-${GITHUB_SHA}"
          else
            echo "::error::Portainer's stored compose does not reference dev-${GITHUB_SHA}."
            echo "It still pins:"
            echo "$STORED" | grep -o 'resort-pro-\(api\|web\):[^ ]*' | sort -u
            exit 1
          fi

      - name: Summary
        run: |
          echo "✅ Staging deployed!"
          echo "🌐 Web:  https://resortpro.webcoronet.com"
          echo "🔌 API:  https://resortpro-api.webcoronet.com"
          echo "📦 Commit: ${{ github.sha }}"
