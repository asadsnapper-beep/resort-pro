name: Verify production image build

# Builds both production images and pushes nothing.
#
# It exists because proving "the release will build" had no safe way to be
# done. deploy.yml's build job is what runs on a release, but dispatching that
# workflow also runs its deploy job. docker-build.yml builds the same two
# Dockerfiles, but pushes `:latest` — moving a floating tag while somebody
# else's release is in flight is how a confusing incident starts.
#
# So: same context, same Dockerfiles, same GHCR base-image pull, `push: false`.
# Use it after changing a Dockerfile, the base-image pin, or anything the
# builds depend on, and before a release that rests on one of those.
#
# Runs on dispatch, and on a push that touches what the images are built from.
# Not on every commit: a full image build would cost minutes for an answer the
# pnpm build in ci.yml already gives about the code. This answers the rarer
# question — can the images still be built at all — which is precisely what a
# Dockerfile or base-image change puts in doubt.
#
# The path trigger is also the only way to run this from a branch:
# workflow_dispatch is offered only once a workflow is on the default branch.

on:
  workflow_dispatch:
  push:
    paths:
      - apps/api/Dockerfile
      - apps/web/Dockerfile
      - .github/workflows/verify-image-build.yml
      - .github/workflows/mirror-base-images.yml

jobs:
  build:
    name: Build ${{ matrix.app }} image (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read, not write: this pulls our mirrored base image and pushes nothing.
      packages: read

    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for the base image: ghcr.io/<owner>/node is a private package,
      # so the FROM cannot be resolved anonymously.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # The web build takes this at build time; harmless for api.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
          cache-from: type=gha,scope=verify-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=verify-${{ matrix.app }}
