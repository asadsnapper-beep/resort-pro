name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Step 1: Build & push Docker images ───────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup-buildx-action pulls moby/buildkit from Docker Hub to run the
      # docker-container driver, and that pull is what failed the staging
      # deploy on 0fa6fa9 — a timeout on auth.docker.io, after the same
      # registry's 429 had already failed CI on 9e0cfe8. Authenticating lifts
      # the anonymous per-IP limit that shared runners are subject to.
      #
      # Skipped when the secrets are absent, so a fork or a checkout without
      # them still builds — it just builds anonymously, as before. moby/buildkit
      # is not on public.ecr.aws or ghcr.io, so the mirror trick used for the
      # base images is not available here.
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
            NEXT_PUBLIC_CLARITY_ID=xw9lf5lnnm
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # NOTE: DB migrations + demo seed run INSIDE the API container at startup
  # (see apps/api/Dockerfile CMD: prisma migrate deploy + seed-demo.js).
  # The production DB is not reachable from GitHub runners (docker-internal
  # host `postgres`), so a runner-side migrate job can never work.

  # ─── Step 2: Deploy via Coolify API ────────────────────────────────────────
  deploy:
    name: Deploy via Coolify
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://resortpro.site

    steps:
      # Root cause (confirmed live, 2026-07-28 via direct Coolify-side debugging):
      # this service's Docker Compose config lives as a raw copy in Coolify's own
      # DB (NOT git-linked to docker-compose.coolify.yml in this repo — editing
      # that file does nothing by itself). The old webhook trigger asked Coolify
      # to redeploy whatever compose it already had stored, with both images
      # pinned to the floating `:latest` tag. Whether that redeploy actually
      # pulled a fresh image depended on `--force-recreate` + `pull_policy: always`
      # cache semantics inside Coolify's queued deploy job — proven unreliable:
      # a fully green run left production running yesterday's image with today's
      # security fixes and routes completely absent.
      #
      # Fix: stamp this commit's SHA onto both image tags and PATCH Coolify's
      # stored compose directly before deploying. A tag Coolify has never pulled
      # before forces a real registry fetch — no dependency on pull_policy,
      # recreate-cache semantics, or any other Coolify internal quirk. (Digest
      # pinning was tried first and rejected: GHCR images from
      # docker/build-push-action are multi-arch manifest lists, and pinning the
      # list digest instead of the platform-specific one fails pull with
      # "manifest unknown" — tags resolve the right platform automatically.)
      - name: Deploy via Coolify API (SHA-tagged, guaranteed fresh)
        env:
          COOLIFY_API: https://manage.musafir.co.za/api/v1/services/b48m2cix8odgfuvlyr8zr31p
        run: |
          set -euo pipefail

          # GET returns docker_compose_raw as plain YAML text — NOT base64. Only
          # the PATCH body needs base64. Treating GET/PATCH as symmetric here was
          # the bug that broke the first version of this step: base64-decoding
          # already-plain text produced garbage that matched nothing below.
          #
          # Also: this field is only visible on a GET at all if COOLIFY_TOKEN has
          # the `read:sensitive` ability (not just `read`/`deploy`) — otherwise
          # it's silently absent from the response with no error, which is why
          # the "missing token scope" case gets its own explicit check below
          # instead of surfacing as a confusing jq/sed failure.
          GET_STATUS=$(curl -s -o /tmp/coolify-get.txt -w "%{http_code}" "$COOLIFY_API" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          if [ "$GET_STATUS" != "200" ]; then
            echo "Refusing to deploy: GET $COOLIFY_API returned HTTP $GET_STATUS, expected 200. Response body:"
            cat /tmp/coolify-get.txt || true
            exit 1
          fi

          CURRENT=$(jq -r '.docker_compose_raw' /tmp/coolify-get.txt)

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "Refusing to deploy: docker_compose_raw missing from GET response — COOLIFY_TOKEN likely needs the 'read:sensitive' ability added in Coolify (Keys & Tokens), not just read/deploy. Full response:"
            cat /tmp/coolify-get.txt || true
            exit 1
          fi

          # Match the tag on resort-pro-api/-web regardless of what it currently
          # is (:latest on the first stamped deploy, :<previous-sha> on every
          # deploy after that) — pinning the sed pattern to :latest alone would
          # only work once, then find nothing to replace on deploy #2 onward.
          NEW=$(echo "$CURRENT" | sed -E \
            -e "s#(resort-pro-api):[A-Za-z0-9_.-]+#\1:${GITHUB_SHA}#" \
            -e "s#(resort-pro-web):[A-Za-z0-9_.-]+#\1:${GITHUB_SHA}#")

          if [ "$NEW" = "$CURRENT" ]; then
            echo "Refusing to deploy: no resort-pro-api/resort-pro-web image lines found to stamp — compose format may have changed, check manually."
            exit 1
          fi

          NEW_B64=$(echo "$NEW" | base64 -w0)

          HTTP_STATUS=$(curl -s -o /tmp/coolify-resp.txt -w "%{http_code}" -X PATCH "$COOLIFY_API" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_compose_raw\": \"$NEW_B64\", \"instant_deploy\": true}")

          echo "Coolify PATCH responded: HTTP $HTTP_STATUS"
          cat /tmp/coolify-resp.txt || true

          # A Cloudflare 52x (or 502/504, or curl's own 000) is the proxy giving
          # up while Coolify carries on behind it. Staging failed three deploys
          # in a row on exactly this while the new image was in fact live, so
          # the status is not treated as a verdict here either. What decides is
          # the next step, which reads the stored compose back and looks for
          # this commit — and that is a real check, unlike the health checks
          # below, which only answer "is something serving".
          #
          # Everything else non-2xx is Coolify refusing: a bad token, a missing
          # service, a malformed body. Those still stop the deploy here.
          case "$HTTP_STATUS" in
            2*) ;;
            52?|504|502|000)
              echo "::warning::Coolify did not answer in time (HTTP $HTTP_STATUS). It may still have applied — the next step checks."
              ;;
            *) echo "Refusing to continue: PATCH returned HTTP $HTTP_STATUS (body above)."; exit 1 ;;
          esac

      # The difference between "Coolify accepted the request" and "Coolify is
      # deploying this commit". Without it a timed-out PATCH, or an accepted one
      # that Coolify then dropped, would reach the health checks — and those
      # pass just as happily on the old image, which would make a silent
      # non-deploy look like a successful release.
      - name: Verify Coolify stored this commit
        env:
          COOLIFY_API: https://manage.musafir.co.za/api/v1/services/b48m2cix8odgfuvlyr8zr31p
        run: |
          set -euo pipefail

          for attempt in $(seq 1 10); do
            STORED=$(curl -s "$COOLIFY_API" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              | jq -r '.docker_compose_raw // ""')

            if echo "$STORED" | grep -q "resort-pro-api:${GITHUB_SHA}"; then
              echo "Coolify's compose pins resort-pro-api:${GITHUB_SHA} (after ${attempt} check(s))"
              exit 0
            fi

            echo "Not stored yet (check ${attempt}/10) — waiting."
            sleep 15
          done

          echo "::error::Coolify's stored compose still does not reference ${GITHUB_SHA} after 10 checks — production is running the previous image."
          echo "It pins:"
          # `|| true` because this step runs under `set -e` and a grep that
          # matches nothing would abort before the explicit exit below, losing
          # the one line that says what is actually deployed.
          echo "$STORED" | grep -oE 'resort-pro-(api|web):[^ "]*' | sort -u || true
          exit 1

      - name: Wait for health check — API
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.resortpro.site/health)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "API health check timed out after 240s"
          exit 1

      - name: Wait for health check — Web
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://resortpro.site)
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Web health check timed out after 240s"
          exit 1

  # ─── Step 4: Post-deploy notification ────────────────────────────────────
  notify:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ ResortPro deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "URL:    https://resortpro.site"

      - name: Deployment failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ ResortPro deployment FAILED"
          echo "Commit: ${{ github.sha }}"
          exit 1
