name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Step 1: Build & push Docker images ───────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # NOTE: DB migrations + demo seed run INSIDE the API container at startup
  # (see apps/api/Dockerfile CMD: prisma migrate deploy + seed-demo.js).
  # The production DB is not reachable from GitHub runners (docker-internal
  # host `postgres`), so a runner-side migrate job can never work.

  # ─── Step 2: Deploy via Coolify API ────────────────────────────────────────
  deploy:
    name: Deploy via Coolify
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://resortpro.site

    steps:
      # Root cause (confirmed live, 2026-07-28 via direct Coolify-side debugging):
      # this service's Docker Compose config lives as a raw copy in Coolify's own
      # DB (NOT git-linked to docker-compose.coolify.yml in this repo — editing
      # that file does nothing by itself). The old webhook trigger asked Coolify
      # to redeploy whatever compose it already had stored, with both images
      # pinned to the floating `:latest` tag. Whether that redeploy actually
      # pulled a fresh image depended on `--force-recreate` + `pull_policy: always`
      # cache semantics inside Coolify's queued deploy job — proven unreliable:
      # a fully green run left production running yesterday's image with today's
      # security fixes and routes completely absent.
      #
      # Fix: stamp this commit's SHA onto both image tags and PATCH Coolify's
      # stored compose directly before deploying. A tag Coolify has never pulled
      # before forces a real registry fetch — no dependency on pull_policy,
      # recreate-cache semantics, or any other Coolify internal quirk. (Digest
      # pinning was tried first and rejected: GHCR images from
      # docker/build-push-action are multi-arch manifest lists, and pinning the
      # list digest instead of the platform-specific one fails pull with
      # "manifest unknown" — tags resolve the right platform automatically.)
      - name: Deploy via Coolify API (SHA-tagged, guaranteed fresh)
        env:
          COOLIFY_API: https://manage.musafir.co.za/api/v1/services/b48m2cix8odgfuvlyr8zr31p
        run: |
          set -euo pipefail

          RAW_B64=$(curl -sf "$COOLIFY_API" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            | jq -r '.docker_compose_raw')
          CURRENT=$(echo "$RAW_B64" | base64 -d)

          # Match the tag on resort-pro-api/-web regardless of what it currently
          # is (:latest on the first stamped deploy, :<previous-sha> on every
          # deploy after that) — pinning the sed pattern to :latest alone would
          # only work once, then find nothing to replace on deploy #2 onward.
          NEW=$(echo "$CURRENT" | sed -E \
            -e "s#(resort-pro-api):[A-Za-z0-9_.-]+#\1:${GITHUB_SHA}#" \
            -e "s#(resort-pro-web):[A-Za-z0-9_.-]+#\1:${GITHUB_SHA}#")

          if [ "$NEW" = "$CURRENT" ]; then
            echo "Refusing to deploy: no resort-pro-api/resort-pro-web image lines found to stamp — compose format may have changed, check manually."
            exit 1
          fi

          NEW_B64=$(echo "$NEW" | base64 -w0)

          HTTP_STATUS=$(curl -sf -o /tmp/coolify-resp.txt -w "%{http_code}" -X PATCH "$COOLIFY_API" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_compose_raw\": \"$NEW_B64\", \"instant_deploy\": true}")

          echo "Coolify PATCH responded: HTTP $HTTP_STATUS"
          cat /tmp/coolify-resp.txt || true

      - name: Wait for health check — API
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.resortpro.site/health)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "API health check timed out after 240s"
          exit 1

      - name: Wait for health check — Web
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://resortpro.site)
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Web health check timed out after 240s"
          exit 1

  # ─── Step 4: Post-deploy notification ────────────────────────────────────
  notify:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ ResortPro deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "URL:    https://resortpro.site"

      - name: Deployment failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ ResortPro deployment FAILED"
          echo "Commit: ${{ github.sha }}"
          exit 1
