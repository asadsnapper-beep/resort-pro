name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep
  # Lifted to env because the `secrets` context is not available in a step's
  # `if`, only in `with`/`env`. `env` is, so the login step can skip itself
  # when the secret is absent.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Step 1: Build & push Docker images ───────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup-buildx-action pulls moby/buildkit from Docker Hub to run the
      # docker-container driver, and that pull is what failed the staging
      # deploy on 0fa6fa9 — a timeout on auth.docker.io, after the same
      # registry's 429 had already failed CI on 9e0cfe8. Authenticating lifts
      # the anonymous per-IP limit that shared runners are subject to.
      #
      # Skipped when the secrets are absent, so a fork or a checkout without
      # them still builds — it just builds anonymously, as before. moby/buildkit
      # is not on public.ecr.aws or ghcr.io, so the mirror trick used for the
      # base images is not available here.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
            NEXT_PUBLIC_CLARITY_ID=xw9lf5lnnm
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # NOTE: DB migrations + demo seed run INSIDE the API container at startup
  # (see apps/api/Dockerfile CMD: prisma migrate deploy + seed-demo.js).
  # The production DB is not reachable from GitHub runners (docker-internal
  # host `postgres`), so a runner-side migrate job can never work.

  # ─── Step 2: Deploy to the production server (Tailscale + restricted SSH) ──
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://resortpro.site

    steps:
      # Production no longer runs under Coolify: it is a plain docker compose stack on the
      # Hetzner server. This job joins our private Tailscale network as the restricted
      # `tag:ci` node (its ACL allows exactly one thing: the deploy-SSH port of that server)
      # and runs ONE command over SSH:   <40-hex commit sha>
      #
      # The server side validates the tag, checks that both images exist in the registry,
      # takes a fresh database dump, switches the image tag, waits for health, and rolls back
      # automatically (and emails the owners) if the new version is not healthy.
      # The SSH key can run nothing else (forced command, tailnet source only).
      #
      # Needs these repository secrets/variables (no addresses or emails live in this file):
      #   secrets:   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY
      #   variables: DEPLOY_HOST, DEPLOY_KNOWN_HOSTS
      - name: Connect to Tailscale (tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy this commit on the server
        timeout-minutes: 12
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (repository secret/variable missing)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p 2222 -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              "deploy@${DEPLOY_HOST}" "${GITHUB_SHA}"

      - name: Wait for health check — API
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.resortpro.site/health)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "API health check timed out after 240s"
          exit 1

      - name: Wait for health check — Web
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://resortpro.site)
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Web health check timed out after 240s"
          exit 1

  # ─── Step 4: Post-deploy notification ────────────────────────────────────
  notify:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ ResortPro deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "URL:    https://resortpro.site"

      - name: Deployment failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ ResortPro deployment FAILED"
          echo "Commit: ${{ github.sha }}"
          exit 1
