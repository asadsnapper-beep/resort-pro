name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Step 1: Build & push Docker images ───────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # NOTE: DB migrations + demo seed run INSIDE the API container at startup
  # (see apps/api/Dockerfile CMD: prisma migrate deploy + seed-demo.js).
  # The production DB is not reachable from GitHub runners (docker-internal
  # host `postgres`), so a runner-side migrate job can never work.

  # ─── Step 2: Deploy via Coolify webhook ───────────────────────────────────
  deploy:
    name: Deploy via Coolify
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://resortpro.site

    steps:
      - name: Trigger Coolify deploy
        # Coolify's deploy webhook requires an API token (Keys & Tokens → API tokens)
        run: |
          STATUS=$(curl -s -o /tmp/coolify-resp.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_WEB }}")
          echo "Coolify responded: HTTP $STATUS"
          cat /tmp/coolify-resp.txt || true
          echo "$STATUS" | grep -qE '^2' || { echo "Coolify deploy failed (HTTP $STATUS)"; exit 1; }

      - name: Wait for health check — API
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.resortpro.site/health)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "API health check timed out after 240s"
          exit 1

      - name: Wait for health check — Web
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://resortpro.site)
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Web health check timed out after 240s"
          exit 1

  # ─── Step 4: Post-deploy notification ────────────────────────────────────
  notify:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ ResortPro deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "URL:    https://resortpro.site"

      - name: Deployment failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ ResortPro deployment FAILED"
          echo "Commit: ${{ github.sha }}"
          exit 1
