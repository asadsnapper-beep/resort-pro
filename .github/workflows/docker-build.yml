name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: asadsnapper-beep

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup-buildx-action pulls moby/buildkit from Docker Hub to run the
      # docker-container driver, and that pull is what failed the staging
      # deploy on 0fa6fa9 — a timeout on auth.docker.io, after the same
      # registry's 429 had already failed CI on 9e0cfe8. Authenticating lifts
      # the anonymous per-IP limit that shared runners are subject to.
      #
      # Skipped when the secrets are absent, so a fork or a checkout without
      # them still builds — it just builds anonymously, as before. moby/buildkit
      # is not on public.ecr.aws or ghcr.io, so the mirror trick used for the
      # base images is not available here.
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-api:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup-buildx-action pulls moby/buildkit from Docker Hub to run the
      # docker-container driver, and that pull is what failed the staging
      # deploy on 0fa6fa9 — a timeout on auth.docker.io, after the same
      # registry's 429 had already failed CI on 9e0cfe8. Authenticating lifts
      # the anonymous per-IP limit that shared runners are subject to.
      #
      # Skipped when the secrets are absent, so a fork or a checkout without
      # them still builds — it just builds anonymously, as before. moby/buildkit
      # is not on public.ecr.aws or ghcr.io, so the mirror trick used for the
      # base images is not available here.
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/resort-pro-web:latest
            ghcr.io/${{ env.OWNER }}/resort-pro-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.resortpro.site
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
