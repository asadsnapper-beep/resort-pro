name: Android

# The Android app had no CI at all until now: ten unit-test files under
# apps/android/app/src/test sat in the repository and nothing ever ran them,
# and nothing ever compiled the app. Kotlin and Compose errors could only be
# found by whoever happened to open Android Studio next.
#
# Unlike the web and API suites this one is path-filtered. A full Gradle build
# downloads the Gradle distribution, the AndroidX dependencies and an SDK
# platform, which is several minutes that a PR touching only apps/web should
# not pay. The consequence is that this check is *skipped*, not failed, on
# PRs that leave apps/android alone — so it must not be made a required
# status check without that in mind.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Android Build & Unit Tests ──────────────────────────────────────────────
  android:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The app sets sourceCompatibility/targetCompatibility to 17, but AGP
      # 9.2.1 and Gradle 9.4.1 both want a 17+ JVM to *run* on, and 21 is what
      # Android Studio ships as its bundled JBR — so 21 is what the app is
      # actually built with day to day. Matching it here keeps CI honest.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle distribution, the dependency cache and the build
      # cache between runs, and validates the checked-in wrapper jar's
      # checksum against Gradle's published list (on by default in v4).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      # apps/android/local.properties is gitignored, so Gradle finds the SDK
      # through these. The runner image pre-sets them and pre-accepts the SDK
      # licences; AGP downloads the compileSdk 37 platform and build-tools
      # itself on first use.
      - name: Report the SDK location Gradle will use
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/licenses" 2>/dev/null || echo "no licences directory"

      # setup-gradle manages the daemon's lifecycle and shuts it down at the
      # end of the job, so the two gradlew invocations below share one warm JVM
      # and one configuration pass instead of paying for both twice.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # `BUILD SUCCESSFUL` from the step above says nothing about how many
      # tests ran. Gradle's "N actionable tasks" counts tasks, not tests, and a
      # run that executes zero tests is exactly as green as one that executes
      # all of them — so a renamed package, a misplaced source directory or a
      # stray filter would sail through CI unnoticed. This reads the JUnit XML
      # and refuses a run that tested nothing.
      - name: Report and assert the unit test count
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          paths = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          if not paths:
              sys.exit('No JUnit XML under app/build/test-results/testDebugUnitTest. '
                       'The test task produced no results at all.')

          tests = failures = errors = skipped = 0
          for path in paths:
              root = ET.parse(path).getroot()
              tests    += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors   += int(root.get('errors', 0))
              skipped  += int(root.get('skipped', 0))

          print(f"{len(paths)} test class{'es' if len(paths) != 1 else ''}")
          print(f'tests={tests} failures={failures} errors={errors} skipped={skipped}')

          if tests == 0:
              sys.exit('The suite ran zero tests, which BUILD SUCCESSFUL does not '
                       'distinguish from a full green run.')
          print(f'{tests} unit tests ran.')
          PY

      # Compile the device-test sources even when this job has no emulator.
      # Running them still requires a separate device/emulator test environment.
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest

      # assembleDebug is the part that catches what the unit tests cannot: a
      # Compose screen referring to a model field that no longer exists, a
      # missing string resource, a navigation route that does not typecheck.
      - name: Debug build
        run: ./gradlew :app:assembleDebug

      # Gradle's console output truncates multi-failure test runs, and the HTML
      # report says which assertion failed and why. Kept on a pass too, so the
      # per-class breakdown behind the printed count is there to check.
      - name: Upload test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: apps/android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
