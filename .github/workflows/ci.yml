name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ── Layer 1: API Permission Tests (Vitest integration) ─────────────────────
  api-tests:
    name: API Permission Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resortpro
          POSTGRES_PASSWORD: resortpro
          POSTGRES_DB: resortpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter @resort-pro/types build && pnpm --filter @resort-pro/database build

      - name: Run DB migrations
        working-directory: packages/database
        run: pnpm prisma migrate deploy

      - name: Seed demo data
        working-directory: apps/api
        run: pnpm seed:demo
        continue-on-error: true   # seed failure shouldn't block tests

      - name: Run API integration tests
        working-directory: apps/api
        run: pnpm vitest run tests/integration

      - name: Run unit + coverage
        run: pnpm test:coverage

  # ── Layer 2: E2E Role Tests (Playwright) ───────────────────────────────────
  e2e-tests:
    name: E2E Role Tests
    runs-on: ubuntu-latest
    needs: api-tests          # only run E2E if API tests pass

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resortpro
          POSTGRES_PASSWORD: resortpro
          POSTGRES_DB: resortpro_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro_e2e
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: test
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: |
          pnpm --filter @resort-pro/types build
          pnpm --filter @resort-pro/database build

      - name: Run DB migrations
        working-directory: packages/database
        run: pnpm prisma migrate deploy

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Seed demo data
        working-directory: apps/api
        run: pnpm seed:demo

      - name: Start API server
        working-directory: apps/api
        run: node dist/index.js &
        env:
          PORT: 4000

      - name: Build Next.js app
        working-directory: apps/web
        run: pnpm build

      - name: Start Next.js server
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E role tests
        working-directory: apps/web
        run: pnpm exec playwright test tests/e2e/roles.spec.ts --reporter=github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Build validation ────────────────────────────────────────────────────────
  build:
    name: Validate Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Validate production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro
          JWT_SECRET: ci-build-secret

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint
