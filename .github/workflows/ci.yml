name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ── Tenant Isolation Guard ─────────────────────────────────────────────────
  tenant-isolation-guard:
    name: Tenant Isolation Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for bare prisma usage in authenticated routes
        run: |
          # Routes that still use bare `prisma.` need to be migrated to `request.db`
          # This check counts them and fails if NEW files are added with bare prisma usage
          VIOLATIONS=$(grep -rl "prisma\." apps/api/src/routes/ | \
            grep -v "node_modules" | sort)
          if [ -n "$VIOLATIONS" ]; then
            echo "⚠️  These route files still use bare prisma (not yet migrated to request.db):"
            echo "$VIOLATIONS"
            echo ""
            echo "Total files remaining: $(echo "$VIOLATIONS" | wc -l | tr -d ' ')"
            echo "See docs/SYSTEM_REVIEW.md §4.1 for migration guide."
            echo "This is a WARNING — not a build failure yet (migration in progress)."
          else
            echo "✅ All routes use tenant-scoped request.db — isolation complete!"
          fi

      # The check above only catches bare `prisma.` usage. It would NOT have
      # caught the 2026-07-25 CRITICAL leak, where routes correctly used the
      # tenant-scoped `db.` client but hit `groupBy` — an operation tenantPrisma
      # had no hook for, so those queries ran unscoped across every tenant.
      # This asserts every data-reaching Prisma operation is intercepted, so
      # dropping a hook (or Prisma adding an operation) fails the build.
      - name: Assert tenantPrisma intercepts every data operation
        run: |
          FILE=packages/database/src/index.ts
          MISSING=""
          for op in findMany findFirst findFirstOrThrow findUnique findUniqueOrThrow \
                    count aggregate groupBy create createMany update updateMany \
                    upsert delete deleteMany; do
            grep -qE "^ *async ${op}\(" "$FILE" || MISSING="$MISSING $op"
          done
          if [ -n "$MISSING" ]; then
            echo "✗ tenantPrisma is missing hooks for:$MISSING"
            echo ""
            echo "Any operation without a hook runs UNSCOPED — it returns and writes"
            echo "rows across all tenants. Add a hook in $FILE (mirror aggregate/groupBy)."
            exit 1
          fi
          echo "✅ tenantPrisma intercepts all expected operations."

      - name: Assert tenantPrisma fails closed on a missing tenantId
        run: |
          # A falsy tenantId makes Prisma treat `where: { tenantId: undefined }`
          # as "no filter", silently unscoping the query. The guard clause must stay.
          if ! grep -q "refusing to run unscoped queries" packages/database/src/index.ts; then
            echo "✗ tenantPrisma's fail-closed guard for a missing tenantId is gone."
            echo "  Without it, a token lacking tenantId (e.g. a refresh token used as"
            echo "  an access token) yields queries that span every tenant."
            exit 1
          fi
          echo "✅ tenantPrisma fails closed without a tenantId."

  # ── Schema Drift Guard ─────────────────────────────────────────────────────
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resortpro
          POSTGRES_PASSWORD: resortpro
          POSTGRES_DB: resortpro_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro_drift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate

      - name: Create shadow DB
        run: PGPASSWORD=resortpro psql -h localhost -U resortpro -d resortpro_drift -c "CREATE DATABASE resortpro_shadow;"

      - name: Check schema is in sync with migrations
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://resortpro:resortpro@localhost:5432/resortpro_shadow" \
            --script \
            --exit-code
        # exit code 2 = drift detected, fail the build

  # ── Layer 1: API Permission Tests (Vitest integration) ─────────────────────
  api-tests:
    name: API Permission Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resortpro
          POSTGRES_PASSWORD: resortpro
          POSTGRES_DB: resortpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter @resort-pro/types build && pnpm --filter @resort-pro/database build

      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate

      - name: Run DB migrations
        working-directory: packages/database
        run: pnpm prisma migrate deploy

      - name: Seed demo data
        working-directory: apps/api
        run: pnpm seed:demo
        continue-on-error: true   # seed failure shouldn't block tests

      - name: Run API integration tests
        working-directory: apps/api
        run: pnpm vitest run tests/integration

      - name: Run unit tests
        # (test:coverage was a turbo task that never existed — run vitest unit suite directly)
        working-directory: apps/api
        run: pnpm exec vitest run tests/unit

  # ── Layer 2: E2E Role Tests (Playwright) ───────────────────────────────────
  e2e-tests:
    name: E2E Role Tests
    runs-on: ubuntu-latest
    needs: api-tests          # only run E2E if API tests pass

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resortpro
          POSTGRES_PASSWORD: resortpro
          POSTGRES_DB: resortpro_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro_e2e
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: test
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: |
          pnpm --filter @resort-pro/types build
          pnpm --filter @resort-pro/database build

      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate

      - name: Run DB migrations
        working-directory: packages/database
        run: pnpm prisma migrate deploy

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Seed demo data
        working-directory: apps/api
        run: pnpm seed:demo

      - name: Start API server
        working-directory: apps/api
        run: node dist/index.js &
        env:
          PORT: 4000

      - name: Start background worker
        working-directory: apps/api
        run: node dist/worker.js &

      - name: Build Next.js app
        working-directory: apps/web
        run: pnpm build

      - name: Start Next.js server
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:4000/health http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        working-directory: apps/web
        # playwright.config.ts defines both a "chromium" and a "Mobile
        # Safari" (webkit) project, and the test step below runs every
        # project by default (no --project flag) — installing only chromium
        # here meant every Mobile Safari test would fail 100% of the time
        # with "Executable doesn't exist" the moment the suite got far
        # enough to actually run.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E role tests
        working-directory: apps/web
        run: pnpm exec playwright test tests/e2e/roles.spec.ts --reporter=github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Build validation ────────────────────────────────────────────────────────
  build:
    name: Validate Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate production build
        run: pnpm --filter=!@resort-pro/desktop --filter=!@resort-pro/ui build
        env:
          DATABASE_URL: postgresql://resortpro:resortpro@localhost:5432/resortpro
          JWT_SECRET: ci-build-secret

  # ── Typecheck (advisory) ─────────────────────────────────────────────────────
  # eslint was never actually installed in this repo, so the old Lint job could
  # never pass. Replaced with tsc typecheck. Advisory (non-blocking) for now:
  # there are ~82 pre-existing type errors (mostly Prisma include-inference noise)
  # tracked as debt — flip continue-on-error off once they're burned down.
  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate

      - name: Typecheck API
        working-directory: apps/api
        run: npx tsc --noEmit

  # ── Design system ratchet (blocking) ─────────────────────────────────────────
  # Existing design debt is allowed to sit, but it may not grow: this fails if
  # any violation category (hardcoded hex, inline styles, arbitrary px sizes,
  # hand-written page headers …) increases above the committed baseline.
  # Blocking on purpose — without it the migration in plan/design-system-
  # migration.md silently regresses. Needs no dependencies, just node.
  design-system:
    name: Design system ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This job runs a plain node script and installs nothing, so it must not
      # touch the package-manager cache at all. Dropping `cache: 'pnpm'` is not
      # enough — setup-node@v5 defaults package-manager-cache to true and
      # detects pnpm from pnpm-lock.yaml on its own, so it has to be switched
      # off explicitly.
      #
      # Caching here was always broken, just invisibly: nothing ever created a
      # pnpm store to save. While the lockfile hash kept hitting an existing
      # cache entry the post-job step had nothing to save and said nothing.
      # Changing the lockfile in 8e1ce7e turned that into a hard failure, with
      # the job's own check and all six other CI jobs green.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Check for design system regressions
        run: node scripts/design-system-ratchet.mjs
